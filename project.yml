name: SecondLook
options:
  bundleIdPrefix: com.avaresearch
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    ALWAYS_SEARCH_USER_PATHS: NO
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    GENERATE_INFOPLIST_FILE: NO
    SWIFT_STRICT_CONCURRENCY: minimal
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      GCC_OPTIMIZATION_LEVEL: "0"
      GCC_PREPROCESSOR_DEFINITIONS: "DEBUG=1 $(inherited)"
      ONLY_ACTIVE_ARCH: YES
      ENABLE_TESTABILITY: YES
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule
      ENABLE_TESTABILITY: NO
schemes:
  SecondLook:
    build:
      targets:
        SecondLook: all
        SecondLookTests: [test]
    run:
      config: Debug
      storeKitConfiguration: SecondLook.storekit
    test:
      gatherCoverageData: true
      storeKitConfiguration: SecondLook.storekit
      targets:
        - SecondLookTests
targets:
  SecondLook:
    type: application
    platform: iOS
    sources:
      - path: SecondLook
      - path: Config
        buildPhase: resources
      - path: SecondLook.storekit
        buildPhase: none
    settings:
      base:
        INFOPLIST_FILE: SecondLook/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.avaresearch.secondlook
        PRODUCT_NAME: SecondLook
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        ENABLE_PREVIEWS: YES
      configs:
        Debug:
          ENABLE_TESTABILITY: YES
    dependencies:
      - target: ShareExtension

  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      - path: SecondLook/Kit
      - path: SecondLook/Support/Theme.swift
    settings:
      base:
        INFOPLIST_FILE: ShareExtension/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.avaresearch.secondlook.share
        PRODUCT_NAME: ShareExtension
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"

  SecondLookTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SecondLookTests
      - path: SecondLook.storekit
        buildPhase: resources
    dependencies:
      - target: SecondLook
    settings:
      base:
        PRODUCT_NAME: SecondLookTests
        PRODUCT_BUNDLE_IDENTIFIER: com.avaresearch.secondlook.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SecondLook.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/SecondLook"
        BUNDLE_LOADER: "$(TEST_HOST)"
