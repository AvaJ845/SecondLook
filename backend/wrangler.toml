name = "secondlook-ai"
main = "src/worker.js"
compatibility_date = "2026-08-01"
preview_urls = false

# Separate worker from Pitchwire's (pitchwire-ai) — nothing shared, no impact on it.
#
# Secrets (never in this file — set with `wrangler secret put`):
#   NVIDIA_API_KEY           build.nvidia.com key (nvapi-…). REQUIRED — the chains lead with
#                            NVIDIA NIM (kimi-k3, GLM-5.3-Flash).
#   OPENROUTER_API_KEY       openrouter.ai key (sk-or-v1-…). REQUIRED — :free fallback models.
#   SECONDLOOK_CLIENT_TOKEN  long random string the app sends as `Authorization: Bearer <...>`
#                            (rotatable scoped token; NOT a provider key) — already set

[vars]
RATE_LIMIT_PER_MIN = "20"

[observability]
enabled = true
